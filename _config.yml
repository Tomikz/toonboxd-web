# Jekyll ne rend ici que les deux politiques de confidentialité, depuis le
# 16 octobre 2026. Leurs sources sont legal/index.md et legal/en/index.md du
# dépôt de l'app, recopiées TELLES QUELLES en confidentialite/index.md et
# privacy/index.md au moment de publier (web/README.md, Publication) : ce
# fichier leur donne la mise en page du site et leur langue, sans toucher à
# leur texte. Tout le reste de ce dossier n'a pas de front matter, et GitHub
# Pages le sert tel quel, octet pour octet.
defaults:
  - scope:
      path: "confidentialite"
    values:
      layout: politique
      lang: fr
      url_fr: /confidentialite/
      url_en: /privacy/
      description: "Ce que Toonboxd sait de toi, où ça va, et ce que tu peux en faire."
  - scope:
      path: "privacy"
    values:
      layout: politique
      lang: en
      url_fr: /confidentialite/
      url_en: /privacy/
      description: "What Toonboxd knows about you, where it goes, and what you can do about it."
# Les deux pages « supprimer son compte », exigées par Google Play (18 novembre
# 2026). Leur source est ce dépôt ; leur texte reprend la politique publiée
# (README.md). Le gabarit lit url_fr, url_en et description pour chaque page.
  - scope:
      path: "suppression-compte"
    values:
      layout: politique
      lang: fr
      url_fr: /suppression-compte/
      url_en: /account-deletion/
      description: "Comment supprimer ton compte Toonboxd, ce qui part et ce qui reste."
  - scope:
      path: "account-deletion"
    values:
      layout: politique
      lang: en
      url_fr: /suppression-compte/
      url_en: /account-deletion/
      description: "How to delete your Toonboxd account, what goes and what stays."
