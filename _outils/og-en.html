<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>og-en</title>
<!--
  LE MODÈLE DE og-en.png, L'IMAGE DE PARTAGE DE LA PAGE ANGLAISE (16 octobre 2026).

  1200 x 630, rendu par _outils/og.py. Il reprend la composition de og.png, la
  française : le logo et le nom, l'accroche de la page, sa promesse en une
  ligne, et la notification d'un retour de hiatus, sur le fond de la charte et
  une lueur violette. Les textes sont ceux de en/index.html (l'accroche) et de
  locales/en.json du dépôt de l'app (la notification, onboarding.hiatus.*).
  La police et l'icône sont celles du site, servies par lui.
-->
<style>
  @font-face { font-family: "Pretendard"; src: url("/assets/fonts/pretendard-regular.woff2") format("woff2"); font-weight: 400; }
  @font-face { font-family: "Pretendard"; src: url("/assets/fonts/pretendard-semibold.woff2") format("woff2"); font-weight: 600; }
  @font-face { font-family: "Pretendard"; src: url("/assets/fonts/pretendard-extrabold.woff2") format("woff2"); font-weight: 800; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative;
    background: radial-gradient(640px 520px at 1010px 400px, rgba(124, 92, 255, 0.34), rgba(124, 92, 255, 0.10) 55%, transparent 80%), #0E0F13;
    color: #F4F5F7;
    font-family: "Pretendard", sans-serif;
    -webkit-font-smoothing: antialiased;
    font-synthesis: none;
  }
  .marque { position: absolute; left: 72px; top: 76px; display: flex; align-items: center; gap: 30px; }
  .marque img { width: 72px; height: 72px; }
  .marque span { font-weight: 600; font-size: 34px; letter-spacing: -0.01em; }
  .kicker { position: absolute; left: 72px; top: 236px; font-weight: 600; font-size: 31px; color: #9AA0AE; letter-spacing: -0.005em; }
  h1 { position: absolute; left: 68px; top: 296px; font-weight: 800; font-size: 82px; line-height: 1.08; letter-spacing: -0.03em; }
  .promesse { position: absolute; left: 72px; top: 518px; font-size: 27px; color: #9AA0AE; }
  .notif {
    position: absolute; left: 700px; top: 150px; width: 441px;
    padding: 20px 22px 20px; border-radius: 30px;
    background: rgba(40, 42, 56, 0.86);
    box-shadow: 0 0 0 1.5px rgba(255, 255, 255, 0.12), 0 24px 48px -16px rgba(0, 0, 0, 0.75);
  }
  .tete { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .tete img { width: 34px; height: 34px; border-radius: 8px; }
  .app { font-size: 17px; font-weight: 600; letter-spacing: 0.04em; color: rgba(244, 245, 247, 0.92); }
  .quand { margin-left: auto; font-size: 17px; color: #9AA0AE; }
  .titre { font-size: 23px; font-weight: 600; line-height: 1.3; }
  .corps { font-size: 19px; line-height: 1.35; color: rgba(244, 245, 247, 0.82); margin-top: 3px; }
</style>
</head>
<body>
  <div class="marque"><img src="/assets/img/icone-96.png" alt=""><span>Toonboxd</span></div>
  <p class="kicker">Manhwa tracker and webtoon tracker</p>
  <h1>Never lose your<br>place again.</h1>
  <p class="promesse">Your progress down to the chapter, and an alert when your series is back.</p>
  <div class="notif">
    <div class="tete"><img src="/assets/img/icone-96.png" alt=""><span class="app">TOONBOXD</span><span class="quand">now</span></div>
    <p class="titre">Nano Machine is back</p>
    <p class="corps">You put it on hold. It’s updating again.</p>
  </div>
</body>
</html>
